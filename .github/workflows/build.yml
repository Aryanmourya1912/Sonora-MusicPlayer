name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout MUST be the first step
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Gradle tooling
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Verify or regenerate gradlew if missing, then fix line endings
      - name: Prepare gradlew
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating wrapper..."
            gradle wrapper
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      # 5. Decode keystore from repository secrets
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      # 6. Build APK
      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      # 7. Upload APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonora-debug-apk
          path: app/build/outputs/apk/debug/*.apk